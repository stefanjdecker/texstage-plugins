[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev4"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-normalization-workshop"
version = "0.4.0"
description = "Bounded normalization analysis with checked FD and lossless-join evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev4"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.normalizationworkshop" = "texstage_normalization_workshop:create_plugin"

[tool.setuptools]
packages = ["texstage_normalization_workshop"]

[tool.setuptools.package-data]
"texstage_normalization_workshop" = ["latex/*.sty", "web/*.mjs", "schemas/*.json", "schemas/commands/*.json", "schemas/views/*.json", "fixtures/*.json"]
