[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev5"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-er-decisions"
version = "0.6.0"
description = "Experimental ER registration engine and interactive prepared lesson"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev5"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.erdecisions" = "texstage_er_decisions:create_plugin"

[tool.setuptools]
packages = ["texstage_er_decisions"]

[tool.setuptools.package-data]
"texstage_er_decisions" = ["web/*.mjs", "schemas/*.json", "schemas/views/*.json", "schemas/commands/*.json", "fixtures/*.json", "latex/*.sty"]
