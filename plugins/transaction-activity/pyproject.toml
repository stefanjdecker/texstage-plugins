[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev7"]
build-backend = "texstage.plugins.sdk"
[project]
name = "texstage-transaction-activity"
version = "0.1.0"
description = "Prepared transaction schedules with phased classroom reasoning and private feedback"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev7"]
[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.transactionactivity" = "texstage_transaction_activity:create_plugin"
[tool.setuptools]
packages = ["texstage_transaction_activity"]
include-package-data = false
[tool.setuptools.package-data]
"texstage_transaction_activity" = ["web/*.mjs", "schemas/*.json", "latex/*.sty", "locales/*.json"]
