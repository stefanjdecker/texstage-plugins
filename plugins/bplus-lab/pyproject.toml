[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev3"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-bplus-lab"
version = "0.4.0"
description = "Experimental TeXStage B+ operation engine, prepared lessons and visual classroom activities"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev3"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.bpluslab" = "texstage_bplus_lab:create_plugin"

[tool.setuptools]
packages = ["texstage_bplus_lab"]
include-package-data = false

[tool.setuptools.package-data]
"texstage_bplus_lab" = ["web/*.mjs", "schemas/*.json", "fixtures/*.json", "latex/*.sty"]

[tool.pytest.ini_options]
junit_family = "xunit1"
