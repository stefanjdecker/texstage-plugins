[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev3"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-query-plan"
version = "0.4.0"
description = "Experimental query-plan classroom activity with plan selectors and cost inspection"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev3"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.queryplan" = "texstage_query_plan:create_plugin"

[tool.setuptools]
packages = ["texstage_query_plan"]
include-package-data = false

[tool.setuptools.package-data]
"texstage_query_plan" = ["web/*.mjs", "schemas/*.json", "schemas/commands/*.json", "schemas/views/*.json", "fixtures/*.json", "latex/*.sty"]
