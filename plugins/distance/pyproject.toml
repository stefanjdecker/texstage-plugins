[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev3"]
build-backend = "texstage.plugins.sdk"
[project]
name = "texstage-example-distance"
version = "0.1.0"
description = "Experimental Texstage distance example plugin"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev3"]
[project.entry-points."texstage.plugins.v1"]
"org.example.distance" = "texstage_example_distance:create_plugin"
[tool.setuptools]
packages = ["texstage_example_distance"]
[tool.setuptools.package-data]
"texstage_example_distance" = ["web/*.mjs", "latex/*.sty", "schemas/*.json"]
