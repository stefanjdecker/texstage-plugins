[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev5"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-fd-lab"
version = "0.6.0"
description = "Experimental TeXStage functional dependencies and keys classroom lab"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev5"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.fdlab" = "texstage_fd_lab:create_plugin"

[tool.setuptools]
packages = ["texstage_fd_lab"]
include-package-data = false

[tool.setuptools.package-data]
"texstage_fd_lab" = ["web/*.mjs", "schemas/*.json", "fixtures/*.json", "schemas/commands/*.json", "schemas/views/*.json", "latex/*.sty"]
