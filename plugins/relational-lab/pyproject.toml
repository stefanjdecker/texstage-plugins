[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev3"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-relational-lab"
version = "0.1.0"
description = "Experimental Texstage relational algebra engine and prepared query-tree lessons"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev3"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.relationallab" = "texstage_relational_lab:create_plugin"

[tool.setuptools]
packages = ["texstage_relational_lab"]

[tool.setuptools.package-data]
"texstage_relational_lab" = ["web/*.mjs", "schemas/*.json", "schemas/commands/*.json", "schemas/views/*.json", "fixtures/*.json", "latex/*.sty"]
