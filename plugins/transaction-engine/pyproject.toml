[build-system]
requires = ["setuptools>=77", "texstage>=0.2.1.dev3"]
build-backend = "texstage.plugins.sdk"

[project]
name = "texstage-transaction-engine"
version = "0.1.0"
description = "Experimental Texstage transaction schedule analysis engine"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["texstage>=0.2.1.dev3"]

[project.entry-points."texstage.plugins.v1"]
"io.github.stefanjdecker.transactionengine" = "texstage_transaction_engine:create_plugin"

[tool.setuptools]
packages = ["texstage_transaction_engine"]

[tool.setuptools.package-data]
"texstage_transaction_engine" = ["web/*.mjs", "schemas/*.json", "fixtures/*.json"]
