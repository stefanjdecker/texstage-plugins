# SPDX-License-Identifier: Apache-2.0
name: WebKit native crash investigation
on:
  push:
    branches: [codex/webkit-load-crash]
    paths:
      - .github/workflows/webkit-diagnostics.yml
      - maintenance/webkit_diagnostics.py
      - maintenance/webkit_http_diagnostics.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  host-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ee9cdf1752ae01f623bcef8bb93df13e3773073c
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.txt
          python -m build --wheel --no-isolation --outdir candidate/host .
          git rev-parse HEAD > candidate/host-commit.txt
          sha256sum candidate/host/*.whl > candidate/wheel-hashes.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: webkit-candidate-host, path: candidate/, retention-days: 14}
  reproduce:
    needs: host-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        workload: [transaction, bplus]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: webkit-candidate-host, path: candidate}
      # Reuse the exact wheels/decks from the failing candidate, without rebuilds.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.workload == 'transaction'
        with:
          name: transactions-handoff
          path: handoff
          run-id: 42458730616
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.workload == 'bplus'
        with:
          name: bplus-lab-wheels
          path: handoff
          run-id: 42458732389
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: matrix.workload == 'bplus'
        with:
          name: bplus-prepared-bundle
          path: handoff/prepared
          run-id: 42458732389
          github-token: ${{ github.token }}
      - name: Install exact candidate and locked browser
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps candidate/host/*.whl handoff/plugins/*.whl
          npm ci --ignore-scripts
          npx playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y --no-install-recommends gdb
          mkdir -p artifacts/identity "$RUNNER_TEMP/texstage-cores"
          git rev-parse HEAD > artifacts/identity/collection-commit.txt
          cp candidate/host-commit.txt artifacts/identity/
          sha256sum candidate/host/*.whl handoff/plugins/*.whl > artifacts/identity/wheels.txt
          node -p 'JSON.stringify({node:process.version,playwright:require("playwright/package.json").version,browser:JSON.parse(require("node:fs").readFileSync(require("node:path").join(require.resolve("playwright-core/package.json"),"..","browsers.json"))).browsers.find(b=>b.name==="${{ matrix.browser }}")})' > artifacts/identity/browser.json
          lscpu > artifacts/identity/cpu.txt
          dpkg-query -W > artifacts/identity/system-packages.txt
          # Disposable hosted runner only; never change a developer machine's core handler.
          test "$GITHUB_ACTIONS" = true
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/texstage-cores/core.%e.%p"
      - name: Installed engines, worker security and both language UIs
        env:
          BROWSER: ${{ matrix.browser }}
          WORKLOAD: ${{ matrix.workload }}
        run: |
          if [[ "$WORKLOAD" == transaction ]]; then
            python maintenance/transaction_engine_probe.py --output artifacts/engine
            node maintenance/transaction_engine_browser.cjs artifacts/engine
          else
            python maintenance/bplus_probe.py --output artifacts/engine
            node maintenance/bplus_browser.cjs artifacts/engine
          fi
          for language in en de; do
            if [[ "$WORKLOAD" == transaction ]]; then
              if [[ "$language" == en ]]; then name=lesson; else name=lesson-de; fi
              TRANSACTION_LANGUAGE="$language" node maintenance/transaction_ui_browser.cjs "handoff/prepared/lesson-$language/out/$name.bundle" artifacts/ui
            else
              BPLUS_LANGUAGE="$language" node maintenance/bplus_ui_browser.cjs "handoff/prepared/$language" artifacts/ui
            fi
          done
      - name: Reproduce with native stderr and process resources
        if: ${{ !cancelled() }}
        env:
          WORKLOAD: ${{ matrix.workload }}
          BROWSER: ${{ matrix.browser }}
          # Observation only: validation must use the installed host fix.
          TEXSTAGE_DIAGNOSTIC_HTTP: observe
        run: |
          ulimit -c unlimited
          if [[ "$WORKLOAD" == transaction ]]; then
            bundle=handoff/prepared/lesson-en/out/lesson.bundle
          else
            bundle=handoff/prepared/en
          fi
          failed=0
          repetitions=1
          if [[ "$BROWSER" == webkit ]]; then repetitions="1 2 3"; fi
          for repetition in $repetitions; do
            if [[ "$repetition" == 2 ]]; then actors=600; else actors=1000; fi
            python maintenance/webkit_diagnostics.py "$WORKLOAD" "$bundle" "artifacts/run-$repetition-$actors" --browser "$BROWSER" --actors "$actors" --cores "$RUNNER_TEMP/texstage-cores" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'webkit-fixed-${{ matrix.workload }}-${{ matrix.browser }}'
          path: |
            artifacts/
            !artifacts/**/profile-*/
          retention-days: 14
