name: ER release conformance
# Explicit opt-in until a compatible host release exists. A development version
# number is not sufficient: language propagation and classroom scheduling matter.
on:
  workflow_dispatch:
    inputs:
      texstage_commit:
        description: Published compatible Texstage commit (full 40-character SHA)
        type: string
        required: true
        default: 'ffb90eba8f698ae73b209841edf309820bc13ed0'
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HOST_COMMIT: ${{ inputs.texstage_commit }}
jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: Require an immutable host identity
        run: python -c "import os,re; assert re.fullmatch(r'[0-9a-f]{40}',os.environ['HOST_COMMIT'])"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_commit }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.15.0'}
      - name: Install locked dependencies and build the host wheel
        run: |
          test "$(git -C host-source rev-parse HEAD)" = "$HOST_COMMIT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern latexmk
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          (cd host-source && python -m build --wheel --no-isolation)
          python -m pip install --no-deps host-source/dist/*.whl
      - name: Require and test the compatible installed host
        working-directory: host-source
        run: |
          python -c "from texstage.plugins.contracts import CONTRACT_VERSION; from texstage.server.app import Server; from texstage.plugin_api.v1 import PutRecord, SetCredit, PublishPoints; from texstage.plugins.runtime import MAX_RECORDS, MAX_CACHED_RESULTS; assert MAX_RECORDS >= 600 and MAX_CACHED_RESULTS >= 27; assert CONTRACT_VERSION == 2; assert hasattr(Server,'plugins_changed'), 'Host lacks coalesced plugin projections'"
          python -m pytest tests/test_plugin_manifest_options.py tests/test_plugin_points.py tests/test_plugin_points_cache.py tests/test_plugin_view_checks.py tests/test_plugin_points_record_contracts.py tests/test_plugin_records.py tests/test_plugin_result_cache.py tests/test_plugin_broadcast.py tests/test_plugin_schema_cache.py tests/test_plugin_classroom.py tests/test_web_plugin_evaluator_poll.py tests/test_plugins.py tests/test_plugin_contracts.py tests/test_plugin_language.py tests/test_web_plugin_lifecycle.py tests/test_server.py -q --junitxml=../artifacts/host-tests.xml
      - name: Build ER alone and prove source/wheel/sdist parity
        run: |
          python maintenance/build_wheels.py --package er-decisions
          python -m pip install --no-deps dist/*.whl
          python -m pytest plugins/er-decisions/tests maintenance/tests/test_er_artifacts.py -q --junitxml=artifacts/er-tests.xml
          python maintenance/er_probe.py --output artifacts/engine
          python maintenance/er_ui_bundle.py --output artifacts/english
          python maintenance/er_ui_bundle.py --output artifacts/german --language de
          python maintenance/er_ui_bundle.py --output artifacts/scored --points 1000
          python maintenance/er_ui_bundle.py --output artifacts/scored-de --points 1000 --language de
      - name: Create the identical-wheel handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          p=Path('handoff'); p.mkdir()
          for source,target in [('dist','plugins'),('host-source/dist','host'),('host-source/requirements','requirements'),('artifacts/english/out/lesson.bundle','english.bundle'),('artifacts/german/out/lesson-de.bundle','german.bundle'),('artifacts/scored/out/lesson.bundle','scored.bundle'),('artifacts/scored-de/out/lesson-de.bundle','scored-de.bundle')]:
              shutil.copytree(source,p/target)
          PY
          python maintenance/er_artifacts.py create handoff --host-commit "$HOST_COMMIT" > artifacts/handoff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: er-portable-handoff, path: handoff/, retention-days: 14, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: er-producer-evidence, path: artifacts/, retention-days: 14}

  regressions:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: original-pair, packages: '--package distance --package coordinates', tests: tests}
          - {name: transaction, packages: '--package transaction-engine', tests: plugins/transaction-engine/tests}
          - {name: relational, packages: '--package relational-lab', tests: plugins/relational-lab/tests}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.15.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: er-portable-handoff, path: handoff}
      - name: Test each existing provider group in its own environment
        env:
          PACKAGES: ${{ matrix.packages }}
          TESTS: ${{ matrix.tests }}
        run: |
          python maintenance/er_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern latexmk
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl
          python maintenance/build_wheels.py $PACKAGES
          python -m pip install --no-deps dist/*.whl
          python -m pytest "$TESTS" -q --junitxml=artifacts/regression-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'er-regression-${{ matrix.name }}', path: artifacts/, retention-days: 14}

  consumers:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: windows-2025, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.15.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: er-portable-handoff, path: handoff}
      - name: Verify and consume the exact artifacts without TeX
        run: |
          python maintenance/er_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          python -m pytest plugins/er-decisions/tests maintenance/tests/test_er_artifacts.py -q -k 'not all_editions_real_build' --junitxml=artifacts/consumer-tests.xml
          python maintenance/er_probe.py --output artifacts/engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'er-consumer-${{ matrix.os }}', path: artifacts/, retention-days: 14}

  browsers:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.15.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: er-portable-handoff, path: handoff}
      - name: Install the verified handoff
        run: |
          python maintenance/er_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
      - name: Check real worker security and both lesson languages
        run: |
          python maintenance/er_probe.py --output artifacts/engine
          node maintenance/er_browser.cjs artifacts/engine
          TEXSTAGE_TEST_PORT=18761 node maintenance/er_lesson_browser.cjs handoff/english.bundle artifacts/ui
          TEXSTAGE_TEST_PORT=18762 node maintenance/er_german_browser.cjs handoff/german.bundle artifacts/german
          TEXSTAGE_TEST_PORT=18763 node maintenance/er_accessibility_browser.cjs handoff/english.bundle artifacts/accessibility
          TEXSTAGE_TEST_PORT=18764 node maintenance/er_accessibility_browser.cjs handoff/german.bundle artifacts/accessibility
          TEXSTAGE_TEST_PORT=18767 node maintenance/er_points_browser.cjs handoff/scored.bundle artifacts/points
          TEXSTAGE_TEST_PORT=18768 node maintenance/er_points_browser.cjs handoff/scored-de.bundle artifacts/points
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'er-browser-${{ matrix.browser }}', path: artifacts/, retention-days: 14}

  native-zoom:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BROWSER: chromium
      ER_NATIVE_ZOOM: '2'
      TEXSTAGE_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.15.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: er-portable-handoff, path: handoff}
      - name: Install verified wheels and Chrome
        run: |
          python maintenance/er_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          npm ci --ignore-scripts
          npx playwright install --with-deps chrome
      - name: Check native 200 percent zoom in both languages
        run: |
          TEXSTAGE_TEST_PORT=18765 node maintenance/er_accessibility_browser.cjs handoff/english.bundle artifacts/native-zoom
          TEXSTAGE_TEST_PORT=18766 node maintenance/er_accessibility_browser.cjs handoff/german.bundle artifacts/native-zoom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: er-native-zoom-evidence, path: artifacts/, retention-days: 14}

  classroom-load:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.15.0'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: er-portable-handoff, path: handoff}
      - name: Require 600-actor capacity, latency and recovery
        run: |
          python maintenance/er_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
          ER_REQUIRE_LOAD_TARGETS=1 ER_LOAD_ACTORS=600 ER_LOAD_RECOVERY=1 node maintenance/er_load_browser.cjs handoff/scored.bundle artifacts/classroom-600
          ER_REQUIRE_LOAD_TARGETS=1 ER_LOAD_ACTORS=32 node maintenance/er_load_browser.cjs handoff/english.bundle artifacts/regression-32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'er-load-${{ matrix.browser }}-evidence', path: artifacts/, retention-days: 14}
