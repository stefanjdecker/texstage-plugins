# SPDX-License-Identifier: Apache-2.0
name: B+ classroom capacity
on:
  workflow_dispatch:
    inputs:
      texstage_ref:
        description: "Published TeXStage commit with fixed points, actor records and batched projections (40-character SHA)"
        required: true
        default: ee9cdf1752ae01f623bcef8bb93df13e3773073c
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        actors: [600, 1000]
    steps:
      - name: Require an immutable host revision
        env:
          HOST_REF: ${{ inputs.texstage_ref }}
        run: |
          [[ "$HOST_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_ref }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install tools and exact dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern latexmk
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          python -m build --wheel --no-isolation --outdir host-dist host-source
          python -m pip install --no-deps host-dist/*.whl
          python -c "from texstage.plugins.worker import Workers; assert hasattr(Workers, 'views'), 'Host requires batched projections'"
          python -c "from texstage.plugin_api.v1 import SaveActor, SetCredit, PublishPoints; from texstage.plugins.records import ActorRecords"
          npm ci --ignore-scripts
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Build and verify the provider
        run: |
          mkdir -p artifacts
          python maintenance/build_bplus_lesson_schemas.py --check
          python maintenance/build_wheels.py --package bplus-lab
          python -m pip install --no-deps dist/*.whl
          python -m pytest plugins/bplus-lab/tests -q --basetemp=artifacts/tests --junitxml=artifacts/tests.xml
          python maintenance/bplus_authoring_probe.py --scenario lesson-en --output artifacts/prepared
      - name: Verify classroom load, replacements and evaluator failover
        env:
          BROWSER: ${{ matrix.browser }}
          BPLUS_ACTORS: ${{ matrix.actors }}
        run: |
          bundle="$(python -c "import json; print(json.load(open('artifacts/prepared/lesson-en/report.json'))['artifacts']['bundle'])")"
          node maintenance/bplus_load_browser.cjs "$bundle" artifacts/load
      - name: Record exact artifacts
        if: always()
        run: |
          mkdir -p artifacts/identity
          git rev-parse HEAD > artifacts/identity/plugin-commit.txt
          git -C host-source rev-parse HEAD > artifacts/identity/host-commit.txt
          sha256sum host-dist/*.whl dist/*.whl > artifacts/identity/wheels.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bplus-${{ matrix.actors }}-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14
