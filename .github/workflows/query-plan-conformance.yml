name: Query-plan release conformance
on:
  workflow_dispatch:
    inputs:
      texstage_commit:
        description: Published compatible TeXStage commit (full reviewed 40-character SHA)
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HOST_COMMIT: ${{ inputs.texstage_commit }}
jobs:
  linux-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require an immutable host pin
        run: '[[ "$HOST_COMMIT" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_commit }}
          path: host-source
          persist-credentials: false
      - run: 'test "$(git -C host-source rev-parse HEAD)" = "$HOST_COMMIT"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Isolate Python
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install locked tools and TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern latexmk
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt -r host-source/requirements/build.txt
          npm ci --ignore-scripts
          npm run check:workers
      - name: Build the host and isolated provider
        run: |
          python -m build --wheel --no-isolation --outdir host-dist host-source
          python -m pip install --no-deps host-dist/*.whl
          python maintenance/build_wheels.py --package query-plan
          python -m pip install --no-deps dist/texstage_query_plan-*.whl
      - name: Exercise installed artifacts and real LaTeX authoring
        run: |
          python maintenance/query_plan_authoring_probe.py --output artifacts/authoring
          QUERY_PLAN_AUTHORING_OUTPUT=artifacts/authoring python -m pytest plugins/query-plan/tests maintenance/tests/test_query_plan_handoff.py -q --junitxml=artifacts/tests.xml
          python -c "import xml.etree.ElementTree as E; t=E.parse('artifacts/tests.xml'); assert not t.findall('.//skipped'), 'Producer must run every authoring test'"
          python maintenance/query_plan_probe.py --output artifacts/engine
      - name: Create a byte-verified handoff
        run: |
          python maintenance/query_plan_handoff.py create --host-wheel host-dist/*.whl --plugin-wheel dist/texstage_query_plan-*.whl --plugin-sdist dist/texstage_query_plan-*.tar.gz --requirements host-source/requirements --bundle artifacts/authoring/out/lesson.bundle --host-commit "$HOST_COMMIT" --output handoff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: query-plan-handoff, path: handoff/, retention-days: 14, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: query-plan-linux, path: artifacts/, retention-days: 14}

  windows-consumer:
    needs: linux-producer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: query-plan-handoff, path: handoff}
      - name: Isolate Python
        run: |
          python -m venv .venv
          python -c "from pathlib import Path; print((Path('.venv')/'Scripts').resolve().as_posix())" >> "$GITHUB_PATH"
      - name: Verify and install identical artifacts
        run: python maintenance/query_plan_handoff.py install handoff --host-commit "$HOST_COMMIT"
      - name: Windows consumer checks (TeX is covered by the producer)
        run: |
          python -m pytest plugins/query-plan/tests maintenance/tests/test_query_plan_handoff.py -q --junitxml=artifacts/tests.xml
          python maintenance/query_plan_probe.py --output artifacts/engine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: query-plan-windows, path: artifacts/, retention-days: 14}

  browser-consumer:
    needs: linux-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: query-plan-handoff, path: handoff}
      - name: Isolate Python
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install identical artifacts and browser
        run: |
          python maintenance/query_plan_handoff.py install handoff --host-commit "$HOST_COMMIT"
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
      - name: Check production CSP, controls, lifecycle and private views
        run: |
          python maintenance/query_plan_probe.py --output artifacts/engine
          node maintenance/query_plan_browser.cjs artifacts/engine
          node maintenance/query_plan_ui_browser.cjs handoff/lesson.bundle artifacts/ui
          node maintenance/query_plan_state_browser.cjs handoff/lesson.bundle artifacts/protocol
          node maintenance/query_plan_authoring_browser.cjs handoff/lesson.bundle artifacts/static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'query-plan-${{ matrix.browser }}', path: artifacts/, retention-days: 14}

  classroom-load:
    needs: linux-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BROWSER: chromium
      QUERY_PLAN_LOAD_ACTORS: '600'
      QUERY_PLAN_LOAD_ROUNDS: '3'
      QUERY_PLAN_LOAD_LEASE_LOSS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: query-plan-handoff, path: handoff}
      - name: Isolate Python
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install identical artifacts and Chromium
        run: |
          python maintenance/query_plan_handoff.py install handoff --host-commit "$HOST_COMMIT"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Measure authenticated submissions and real evaluator recovery
        run: node maintenance/query_plan_load_browser.cjs handoff/lesson.bundle artifacts/load
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: query-plan-load, path: artifacts/, retention-days: 14}
