name: Plugin conformance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      texstage_ref:
        description: Exact compatible Texstage commit SHA
        default: ee9cdf1752ae01f623bcef8bb93df13e3773073c
        required: true
      capacity:
        description: Run the measured 600-student bursts and separate Chromium headroom check
        type: boolean
        default: false
      bplus_texstage_ref:
        description: Published TeXStage commit with manifest-4 points and actor records (40-character SHA)
        required: false
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HOST_COMMIT: ${{ inputs.texstage_ref || 'ee9cdf1752ae01f623bcef8bb93df13e3773073c' }}
jobs:
  worker-bundles:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts
      - run: npm run check:workers

  linux-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_ref || 'ee9cdf1752ae01f623bcef8bb93df13e3773073c' }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install TeX and locked Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern latexmk
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          cd host-source
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
      - name: Build independent wheels and check sdist parity
        run: |
          python maintenance/build_wheels.py --package distance --package coordinates
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          python -m pytest tests -q --basetemp=artifacts/checks --junitxml=artifacts/tests.xml
      - name: Browser matrix
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          BROWSER=chromium node maintenance/browser_conformance.cjs
          BROWSER=firefox node maintenance/browser_conformance.cjs
          BROWSER=webkit node maintenance/browser_conformance.cjs
      - name: Stage the portable handoff
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('handoff'); p.mkdir(); shutil.copytree('dist',p/'plugins'); shutil.copytree('host-source/dist',p/'host'); shutil.copytree('host-source/requirements',p/'requirements'); shutil.copytree('artifacts/checks/plugins-installed0/out',p/'out')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: portable-wheels-and-linux-bundle, path: handoff/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: linux-conformance, path: artifacts/, retention-days: 14}

  windows-consumer:
    needs: linux-producer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: portable-wheels-and-linux-bundle, path: handoff}
      - name: Install the identical wheels and serve the Linux-authored deck
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          mkdir -p artifacts
          TEXSTAGE_TEST_BUNDLE=handoff/out/plane.bundle python -m pytest tests -q --basetemp=artifacts/checks --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: windows-consumer, path: artifacts/tests.xml, retention-days: 14}

  transaction-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_ref || 'ee9cdf1752ae01f623bcef8bb93df13e3773073c' }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install the matching host wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          cd host-source
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -c "from texstage.plugins.contracts import CONTRACT_VERSION; assert CONTRACT_VERSION == 2, 'Select a host with typed plugin contracts'"
      - name: Build and test the isolated engine
        run: |
          python maintenance/build_wheels.py --package transaction-engine
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          python -m pytest plugins/transaction-engine/tests -q --junitxml=artifacts/transaction-engine-tests.xml
          python maintenance/transaction_engine_probe.py
          git -C host-source rev-parse HEAD > artifacts/transaction-engine/host-commit.txt
      - name: Stage identical wheels for Windows
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('engine-handoff'); p.mkdir(); shutil.copytree('dist',p/'plugins'); shutil.copytree('host-source/dist',p/'host'); shutil.copytree('host-source/requirements',p/'requirements')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: transaction-engine-wheels, path: engine-handoff/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: transaction-engine-linux, path: artifacts/, retention-days: 14}

  transaction-engine-browsers:
    needs: transaction-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: transaction-engine-wheels, path: handoff}
      - name: Test the unchanged host worker policy
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          python maintenance/transaction_engine_probe.py
          npm ci
          npx playwright install --with-deps "$BROWSER"
          node maintenance/transaction_engine_browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transaction-engine-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14

  transaction-engine-windows:
    needs: transaction-engine
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: transaction-engine-wheels, path: handoff}
      - name: Test the identical Linux-built engine wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          mkdir -p artifacts
          python -m pytest plugins/transaction-engine/tests -q --junitxml=artifacts/transaction-engine-tests.xml
          python maintenance/transaction_engine_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: transaction-engine-windows, path: artifacts/, retention-days: 14}

  relational-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_ref || 'ee9cdf1752ae01f623bcef8bb93df13e3773073c' }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install the matching host wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          cd host-source
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -c "from texstage.plugins.contracts import CONTRACT_VERSION; assert CONTRACT_VERSION == 2, 'Select a host with typed plugin contracts'"
      - name: Install TeX for prepared lesson editions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern latexmk
      - name: Build and test the isolated engine and lesson
        run: |
          python maintenance/build_wheels.py --package relational-lab
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          RELATIONAL_TEST_EXPORTS=artifacts/relational-exports python -m pytest plugins/relational-lab/tests -q --basetemp=artifacts/lesson-tests --junitxml=artifacts/relational-lab-tests.xml
          python -c "import xml.etree.ElementTree as E; assert not E.parse('artifacts/relational-lab-tests.xml').findall('.//skipped'), 'Both authoring languages must execute in the producer'"
          python maintenance/relational_probe.py
          git -C host-source rev-parse HEAD > artifacts/relational-lab/host-commit.txt
      - name: Stage identical wheels for Windows
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('engine-handoff'); p.mkdir(); shutil.copytree('dist',p/'plugins'); shutil.copytree('host-source/dist',p/'host'); shutil.copytree('host-source/requirements',p/'requirements'); shutil.copytree('artifacts/relational-exports',p/'bundles')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: relational-lab-wheels, path: engine-handoff/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: relational-lab-linux, path: artifacts/, retention-days: 14}

  relational-lab-browsers:
    needs: relational-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: relational-lab-wheels, path: handoff}
      - name: Test the unchanged host worker policy
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          python maintenance/relational_probe.py
          npm ci
          npx playwright install --with-deps "$BROWSER"
          node maintenance/relational_browser.cjs
          RELATIONAL_LANGUAGE=en node maintenance/relational_lesson_browser.cjs handoff/bundles/en/lesson.bundle
          RELATIONAL_LANGUAGE=de node maintenance/relational_lesson_browser.cjs handoff/bundles/de/lesson.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: relational-lab-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14

  relational-lab-windows:
    needs: relational-lab
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: relational-lab-wheels, path: handoff}
      - name: Test the identical Linux-built engine wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          mkdir -p artifacts
          python -m pytest plugins/relational-lab/tests -q --junitxml=artifacts/relational-lab-tests.xml
          python maintenance/relational_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: relational-lab-windows, path: artifacts/, retention-days: 14}

  fd-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_ref || 'ee9cdf1752ae01f623bcef8bb93df13e3773073c' }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Verify the immutable host checkout
        run: |
          [[ "$HOST_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C host-source rev-parse HEAD)" = "$HOST_COMMIT"
      - name: Install the matching host wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt -r host-source/requirements/build.txt
          cd host-source
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -c "from texstage.plugins.contracts import CONTRACT_VERSION; assert CONTRACT_VERSION == 2, 'Select a host with typed plugin contracts'"
      - name: Install TeX and both lesson languages
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern
      - name: Check generated provider workers
        run: |
          npm ci --ignore-scripts
          npm run check:workers
      - name: Build and test all modes and both authoring languages
        run: |
          python maintenance/build_wheels.py --package fd-lab
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          FD_TEST_EXPORTS=artifacts/fd-exports python -m pytest plugins/fd-lab/tests maintenance/tests/test_fd_artifacts.py -q --basetemp=artifacts/fd-tests --junitxml=artifacts/fd-lab-tests.xml
          python -c "import xml.etree.ElementTree as E; assert not E.parse('artifacts/fd-lab-tests.xml').findall('.//skipped'), 'Linux producer must execute both TeX authoring cases'"
          test -f artifacts/fd-exports/en/lesson.bundle/deck.json
          test -f artifacts/fd-exports/de/lesson.bundle/deck.json
          python maintenance/fd_probe.py
          git -C host-source rev-parse HEAD > artifacts/fd-lab/host-commit.txt
      - name: Stage identical wheels and prepared bundle for consumers
        run: |
          python maintenance/fd_artifacts.py create --host-wheel host-source/dist/texstage-0.2.1.dev7-py3-none-any.whl --plugin-wheel dist/texstage_fd_lab-0.6.0-py3-none-any.whl --plugin-sdist dist/texstage_fd_lab-0.6.0.tar.gz --requirements host-source/requirements --bundles artifacts/fd-exports --host-commit "$HOST_COMMIT" --output engine-handoff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fd-lab-wheels, path: engine-handoff/, retention-days: 14, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: fd-lab-linux, path: artifacts/, retention-days: 14}

  fd-lab-browsers:
    needs: fd-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: fd-lab-wheels, path: handoff}
      - name: Test the unchanged host worker policy
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python maintenance/fd_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/wheels/*.whl
          python maintenance/fd_artifacts.py installed handoff --host-commit "$HOST_COMMIT"
          python maintenance/fd_probe.py
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
          node maintenance/fd_browser.cjs
          node maintenance/fd_lesson_browser.cjs handoff/bundles/en/lesson.bundle
          node maintenance/fd_release_browser.cjs handoff/bundles/de/lesson.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fd-lab-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14

  fd-lab-windows:
    needs: fd-lab
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: fd-lab-wheels, path: handoff}
      - name: Test the identical Linux-built wheel (static TeX exports covered in Linux job)
        run: |
          python maintenance/fd_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/wheels/*.whl
          python maintenance/fd_artifacts.py installed handoff --host-commit "$HOST_COMMIT"
          mkdir -p artifacts
          python -m pytest plugins/fd-lab/tests maintenance/tests/test_fd_artifacts.py -q --basetemp=artifacts/fd-tests --junitxml=artifacts/fd-lab-tests.xml
          python maintenance/fd_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: fd-lab-windows, path: artifacts/, retention-days: 14}

  bplus-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BPLUS_HOST_REF: ${{ inputs.bplus_texstage_ref || vars.TEXSTAGE_BPLUS_HOST_REF || 'ee9cdf1752ae01f623bcef8bb93df13e3773073c' }}
    steps:
      - name: Require the published scoring and actor-record host pin
        run: |
          if [[ ! "$BPLUS_HOST_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Set TEXSTAGE_BPLUS_HOST_REF or bplus_texstage_ref to the compatible published host SHA."
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ env.BPLUS_HOST_REF }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install the matching host wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          cd host-source
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -c "from texstage.plugins.contracts import CONTRACT_VERSION; assert CONTRACT_VERSION == 2, 'Select a host with typed plugin contracts'"
      - name: Build and test the scored B+ provider
        run: |
          python -c "from texstage.plugin_api.v1 import SaveActor, SetCredit, PublishPoints; from texstage.plugins.runtime import Runtime; assert callable(Runtime.views), 'Select the matching scoring and batched actor-record host'"
          python maintenance/build_bplus_schemas.py --check
          python maintenance/build_bplus_lesson_schemas.py --check
          python maintenance/build_wheels.py --package bplus-lab
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          python -m pytest plugins/bplus-lab/tests/test_engine.py plugins/bplus-lab/tests/test_state.py plugins/bplus-lab/tests/test_storage.py plugins/bplus-lab/tests/test_ui.py plugins/bplus-lab/tests/test_grading.py -q --basetemp=artifacts/bplus-tests --junitxml=artifacts/bplus-lab-tests.xml
          python maintenance/bplus_probe.py
          git -C host-source rev-parse HEAD > artifacts/bplus-lab/host-commit.txt
      - name: Stage identical wheels for Windows
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('engine-handoff'); p.mkdir(); shutil.copytree('dist',p/'plugins'); shutil.copytree('host-source/dist',p/'host'); shutil.copytree('host-source/requirements',p/'requirements')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: bplus-lab-wheels, path: engine-handoff/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: bplus-lab-linux, path: artifacts/, retention-days: 14}

  bplus-lab-browsers:
    needs: bplus-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: bplus-lab-wheels, path: handoff}
      - name: Test the unchanged host worker policy
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          python maintenance/bplus_probe.py
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
          node maintenance/bplus_browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bplus-lab-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14

  bplus-lab-windows:
    needs: bplus-lab
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: bplus-lab-wheels, path: handoff}
      - name: Test the identical Linux-built engine wheel
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          mkdir -p artifacts
          python -m pytest plugins/bplus-lab/tests/test_engine.py plugins/bplus-lab/tests/test_state.py plugins/bplus-lab/tests/test_storage.py plugins/bplus-lab/tests/test_ui.py plugins/bplus-lab/tests/test_grading.py -q --basetemp=artifacts/bplus-tests --junitxml=artifacts/bplus-lab-tests.xml
          python maintenance/bplus_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: bplus-lab-windows, path: artifacts/, retention-days: 14}

  bplus-prepared:
    needs: bplus-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: bplus-lab-wheels, path: handoff}
      - name: Install the identical wheels and TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          pdflatex --version
      - name: Check prepared authoring and all editions
        run: |
          mkdir -p artifacts
          python -m pytest plugins/bplus-lab/tests/test_authoring.py -q --basetemp=artifacts/bplus-authoring-tests --junitxml=artifacts/bplus-authoring-tests.xml
          python maintenance/bplus_authoring_probe.py --output artifacts/bplus-prepared
          python -c "from pathlib import Path; import json,shutil; [shutil.copytree(json.loads(Path(f'artifacts/bplus-prepared/lesson-{lang}/report.json').read_text(encoding='utf-8'))['artifacts']['bundle'], f'prepared-bundle/{lang}') for lang in ('en','de')]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: bplus-prepared-bundle, path: prepared-bundle/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: bplus-prepared-editions, path: artifacts/, retention-days: 14}

  bplus-prepared-browsers:
    needs: bplus-prepared
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        language: [en, de]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: bplus-lab-wheels, path: handoff}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: bplus-prepared-bundle, path: prepared-bundle}
      - name: Exercise the installed prepared lesson
        env:
          BROWSER: ${{ matrix.browser }}
          BPLUS_LANGUAGE: ${{ matrix.language }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
          if [ "$BPLUS_LANGUAGE" = en ]; then
            node maintenance/bplus_prepared_browser.cjs prepared-bundle/en artifacts/bplus-prepared-browser
            node maintenance/bplus_classroom_browser.cjs prepared-bundle/en artifacts/bplus-classroom
          fi
          node maintenance/bplus_ui_browser.cjs "prepared-bundle/$BPLUS_LANGUAGE" artifacts/bplus-ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bplus-prepared-${{ matrix.browser }}-${{ matrix.language }}
          path: artifacts/
          retention-days: 14
  fd-lab-capacity:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capacity }}
    needs: fd-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      TEXSTAGE_CLASSROOM_ACTORS: '600'
      TEXSTAGE_CLASSROOM_DIVERSE: '1'
      TEXSTAGE_CLASSROOM_REPLACE: '1'
      TEXSTAGE_CLASSROOM_RECONNECT: '1'
      TEXSTAGE_CLASSROOM_ENFORCE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: fd-lab-wheels, path: handoff}
      - name: Install and verify the exact producer artifacts
        id: installed
        run: |
          python maintenance/fd_artifacts.py verify handoff --host-commit "$HOST_COMMIT"
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/wheels/*.whl
          python maintenance/fd_artifacts.py installed handoff --host-commit "$HOST_COMMIT"
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
      - name: Measure 600 students in all three modes, including replacements
        env:
          TEXSTAGE_CLASSROOM_RUN: capacity-600
        run: node maintenance/fd_classroom_browser.cjs handoff/bundles/en/lesson.bundle
      - name: Measure separate 1,000-student headroom in Chromium
        if: ${{ always() && matrix.browser == 'chromium' && steps.installed.outcome == 'success' }}
        env:
          TEXSTAGE_CLASSROOM_RUN: headroom-1000
          TEXSTAGE_CLASSROOM_ACTORS: '1000'
          TEXSTAGE_CLASSROOM_MODES: practice
          # The latency gate is for 600; headroom still enforces correctness.
          TEXSTAGE_CLASSROOM_ENFORCE: '0'
        run: node maintenance/fd_classroom_browser.cjs handoff/bundles/en/lesson.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'fd-lab-capacity-${{ matrix.browser }}', path: artifacts/, retention-days: 14}
