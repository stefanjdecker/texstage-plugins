      - name: Build and test the isolated engine
        run: |
          python maintenance/build_bplus_schemas.py --check
          python maintenance/build_bplus_lesson_schemas.py --check
          python maintenance/build_wheels.py --package bplus-lab
          python -m pip install --no-deps dist/*.whl
          python -m pytest plugins/bplus-lab/tests/test_engine.py plugins/bplus-lab/tests/test_state.py plugins/bplus-lab/tests/test_ui.py -q --basetemp=artifacts/bplus-tests --junitxml=artifacts/bplus-lab-tests.xml
          python maintenance/bplus_probe.py
          git -C host-source rev-parse HEAD > artifacts/bplus-lab/host-commit.txt
      - name: Stage identical wheels for Windows
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('engine-handoff'); p.mkdir(); shutil.copytree('dist',p/'plugins'); shutil.copytree('host-source/dist',p/'host'); shutil.copytree('host-source/requirements',p/'requirements')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: bplus-lab-wheels, path: engine-handoff/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: bplus-lab-linux, path: artifacts/, retention-days: 14}

  bplus-lab-browsers:
    needs: bplus-lab
    runs-on: ubuntu-24.04
