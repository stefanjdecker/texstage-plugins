name: Plugin conformance
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      texstage_ref:
        description: Compatible Texstage commit or branch to test
        default: main
        required: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  linux-producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_ref || 'main' }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install TeX and locked Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended lmodern latexmk
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          cd host-source
          python -m build --wheel --no-isolation
          python -m pip install --no-deps dist/*.whl
      - name: Build independent wheels and check sdist parity
        run: |
          python maintenance/build_wheels.py
          python -m pip install --no-deps dist/*.whl
          mkdir -p artifacts
          python -m pytest tests -q --basetemp=artifacts/checks --junitxml=artifacts/tests.xml
      - name: Browser matrix
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          BROWSER=chromium node maintenance/browser_conformance.cjs
          BROWSER=firefox node maintenance/browser_conformance.cjs
          BROWSER=webkit node maintenance/browser_conformance.cjs
      - name: Stage the portable handoff
        run: |
          python -c "from pathlib import Path; import shutil; p=Path('handoff'); p.mkdir(); shutil.copytree('dist',p/'plugins'); shutil.copytree('host-source/dist',p/'host'); shutil.copytree('host-source/requirements',p/'requirements'); shutil.copytree('artifacts/checks/plugins-installed0/out',p/'out')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: portable-wheels-and-linux-bundle, path: handoff/, retention-days: 14}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: linux-conformance, path: artifacts/, retention-days: 14}

  windows-consumer:
    needs: linux-producer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.14'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: portable-wheels-and-linux-bundle, path: handoff}
      - name: Install the identical wheels and serve the Linux-authored deck
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/dev.txt
          python -m pip install --no-deps handoff/host/*.whl handoff/plugins/*.whl
          mkdir -p artifacts
          TEXSTAGE_TEST_BUNDLE=handoff/out/plane.bundle python -m pytest tests -q --basetemp=artifacts/checks --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: windows-consumer, path: artifacts/tests.xml, retention-days: 14}
