name: Normalization Workshop conformance
on:
  push:
    paths:
      - 'plugins/normalization-workshop/**'
      - 'examples/normalization/**'
      - 'maintenance/*normalization*'
      - 'maintenance/serve_lesson.py'
      - '.github/workflows/normalization-conformance.yml'
  pull_request:
    paths:
      - 'plugins/normalization-workshop/**'
      - 'examples/normalization/**'
      - 'maintenance/*normalization*'
      - 'maintenance/serve_lesson.py'
      - '.github/workflows/normalization-conformance.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  HOST_COMMIT: '6b64828b98e9908fc67c265cab31a71a216308d5'
jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: '6b64828b98e9908fc67c265cab31a71a216308d5'
          path: host-source
          persist-credentials: false
      - run: 'test "$(git -C host-source rev-parse HEAD)" = "$HOST_COMMIT"'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Install isolated locked tools and TeX
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt -r host-source/requirements/build.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-german lmodern latexmk
          npm ci --ignore-scripts
          npm run check:workers
      - name: Build and install portable host and workshop
        run: |
          python -m build --wheel --no-isolation --outdir host-dist host-source
          python -m pip install --no-deps host-dist/*.whl
          python maintenance/build_wheels.py --package normalization-workshop
          python -m pip install --no-deps dist/texstage_normalization_workshop-*.whl
      - name: Test the installed workshop, authoring and evidence checks
        run: |
          mkdir -p artifacts
          python -m pytest plugins/normalization-workshop/tests -q --basetemp=artifacts/checks --junitxml=artifacts/tests.xml
          python -c "import xml.etree.ElementTree as E; assert not E.parse('artifacts/tests.xml').findall('.//skipped'), 'All producer tests must run'"
          node --test maintenance/normalization_load_checks.test.cjs
      - name: Prepare identical artifacts for browser consumers
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          out=Path('handoff');out.mkdir()
          shutil.copytree('host-dist',out/'host')
          shutil.copytree('dist',out/'provider')
          shutil.copytree('host-source/requirements',out/'requirements')
          bundles=list(Path('artifacts/checks').rglob('lesson.bundle'))
          assert len(bundles)==1
          shutil.copytree(bundles[0],out/'lesson.bundle')
          files={p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file()}
          (out/'sha256.json').write_text(json.dumps(files,indent=2)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: normalization-handoff, path: handoff/, retention-days: 14, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: normalization-producer, path: artifacts/tests.xml, retention-days: 14}

  browser:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, firefox, webkit]}
    env:
      BROWSER: ${{ matrix.browser }}
      PYTHON: python
      NORMALIZATION_LESSON_OUTPUT: artifacts/lesson
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: normalization-handoff, path: handoff}
      - name: Verify and install the producer's exact wheels
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('handoff')
          for name,digest in json.loads((root/'sha256.json').read_text(encoding='utf-8')).items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          PY
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r handoff/requirements/runtime.txt
          .venv/bin/python -m pip install --no-deps handoff/host/*.whl handoff/provider/*.whl
          npm ci --ignore-scripts
          npx playwright install --with-deps "$BROWSER"
      - name: Test restricted workers and native points interactions
        run: |
          python maintenance/normalization_probe.py --output artifacts/engine
          node maintenance/normalization_browser.cjs artifacts/engine
          node maintenance/normalization_lesson_browser.cjs handoff/lesson.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: normalization-${{ matrix.browser }}
          retention-days: 14
          path: |
            artifacts/engine/browser-*.json
            artifacts/lesson/*.json
            artifacts/lesson/*.png
            artifacts/lesson/*.csv
            artifacts/lesson/failure-*.txt
