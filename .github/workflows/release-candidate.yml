name: Prepare plugin release candidates
on:
  workflow_dispatch:
    inputs:
      texstage_commit:
        description: Full reviewed Texstage commit SHA containing the experimental SDK
        required: true
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {persist-credentials: false}
      - name: Require a pinned host SDK
        env: {TEXSTAGE_COMMIT: '${{ inputs.texstage_commit }}'}
        run: python -c "import os,re; assert re.fullmatch('[a-f0-9]{40}',os.environ['TEXSTAGE_COMMIT'])"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: stefanjdecker/texstage
          ref: ${{ inputs.texstage_commit }}
          path: host-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Build reviewed portable packages
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r host-source/requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation host-source
          python maintenance/build_wheels.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: reviewed-plugin-release-candidates, path: dist/, retention-days: 30}
